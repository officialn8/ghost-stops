name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # The root config excludes scripts/; the worker entry and the operator scripts live there.
      - name: Type check scripts
        run: npx tsc --noEmit -p tsconfig.scripts.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ghost_stops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghost_stops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container that exists only for this job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghost_stops_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/ghost_stops_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Database tests
        run: npm run test:db

  worker-image:
    name: Worker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag ghost-stops-worker:ci .

      # The runtime stage must carry the bundle, no env file, and no dev dependency (plan U20).
      - name: Check the image's contents
        run: |
          docker run --rm ghost-stops-worker:ci sh -c '
            set -e
            [ -f /app/dist/live-worker.mjs ] || { echo "::error::no bundle in the image"; exit 1; }
            if find / -maxdepth 2 -name ".env*" 2>/dev/null | grep -q .; then echo "::error::an env file is in the image"; exit 1; fi
            for dev in tsx prisma vitest eslint typescript esbuild; do
              if [ -e "/app/node_modules/$dev" ]; then echo "::error::dev dependency $dev is in the image"; exit 1; fi
            done
            echo "bundle present, no env file, no dev dependency; node $(node --version)"
          '

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, copied from that release's checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir gitleaks-bin
          tar -xzf "$tarball" -C gitleaks-bin
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      # With no --log-opts, gitleaks scans `git log --all`: every commit on every fetched ref.
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose --exit-code 1 .

      # Positive control: a clean scan cannot tell "no leaks" from "rules stopped matching" (regex edit,
      # gitleaks upgrade). Re-scan without the baseline and fail unless every baselined leak is reported.
      - name: Verify baselined leaks are still detected
        shell: bash
        run: |
          # A bare clone has no working tree to hold .gitleaksignore, and $RUNNER_TEMP has none either,
          # so no baseline applies. --mirror also copies remote-tracking refs, matching the scan above.
          git clone --quiet --mirror "$GITHUB_WORKSPACE" "$RUNNER_TEMP/history.git"
          cd "$RUNNER_TEMP"
          gitleaks git --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/positive-control.json" history.git
          jq -r '.[]? | .Fingerprint' positive-control.json | sort -u > reported.txt
          sed -E '/^[[:space:]]*(#|$)/d' "$GITHUB_WORKSPACE/.gitleaksignore" | sort -u > baselined.txt
          missing="$(comm -13 reported.txt baselined.txt)"
          if [ -n "$missing" ]; then
            echo "::error::Baselined leaks no longer detected (rule stopped matching, or stale baseline entry):"
            echo "$missing"
            exit 1
          fi
          echo "Positive control passed: all $(wc -l < baselined.txt) baselined leaks are still detected."
